name: Flutter CI

on:
  push:
    branches: [ "flutter-rewrite", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.24.0' # Or the latest stable

    - name: Scaffold Flutter native folders
      run: |
        flutter create --org com.suspended.app --project-name suspended_flutter .
        # Flutter 3.24 sometimes defaults to older Kotlin which causes metadata errors with new AndroidX libs.
        # Patch the settings.gradle / build.gradle to use Kotlin 1.9.24 using regex
        if [ -f android/settings.gradle ]; then
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
        fi
        if [ -f android/build.gradle ]; then
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/" android/build.gradle
        fi

    - name: Install dependencies
      run: flutter pub get





    - name: Build APK
      run: flutter build apk --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: suspended-app-apk
        path: build/app/outputs/flutter-apk/app-debug.apk
