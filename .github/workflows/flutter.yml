name: Flutter CI

on:
  push:
    branches: [ "flutter-rewrite", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.24.0' # Or the latest stable

    - name: Scaffold Flutter native folders
      run: flutter create --org com.suspended.app --project-name suspended_flutter .

    - name: Install dependencies
      run: flutter pub get





    - name: Build APK
      run: flutter build apk --debug
