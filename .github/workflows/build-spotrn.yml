name: Build SuspendedRN Android APK

on:
  push:
    branches: [ spotrn ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm
        working-directory: SuspendedRN
        run: npm install --legacy-peer-deps

      - name: Build APK
        working-directory: SuspendedRN/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suspendedrn-debug
          path: SuspendedRN/android/app/build/outputs/apk/debug/app-debug.apk
