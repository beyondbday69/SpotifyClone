name: Build SuspendedRN Android APK

on:
  push:
    branches: [ spotrn ]
  pull_request:
    branches: [ spotrn ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        working-directory: SuspendedRN
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Verify autolink works
        working-directory: SuspendedRN
        run: npx react-native config 2>&1 | head -20 || echo "Config check completed"

      - name: Clean Gradle caches
        working-directory: SuspendedRN/android
        run: |
          rm -rf .gradle build app/build

      - name: Grant execute permission for gradlew
        working-directory: SuspendedRN/android
        run: chmod +x gradlew

      - name: Build debug APK (with Chaquopy + yt-dlp)
        working-directory: SuspendedRN/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: suspendedrn-debug
          path: SuspendedRN/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
